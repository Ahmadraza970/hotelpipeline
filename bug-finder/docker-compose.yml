version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Set to "true" to install Node + eslint/tsc for JS/TS linting.
        INSTALL_NODE: "false"
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./data:/app/data/projects:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
